name: trade

on:
  schedule:
    # Every 15 minutes, matching the signal timeframe. GitHub delays scheduled
    # runs under load, so a check can land late or be skipped; see the hosting
    # notes in README.md. Actions disables schedules after 60 days of repository
    # inactivity - re-enable from the Actions tab if that happens.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a delayed run overlap with the next one and double-submit.
  group: trade
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Evaluate RSI crossover and trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOL: BTC/USD
          SIGNAL_MINUTES: "15"
          CHART_MINUTES: "1"
          RSI_PERIOD: "14"
          RSI_ENTRY: "50"
          RSI_EXIT: "50"
          TARGET_QTY: "1"
          FALLBACK_EQUITY_PCT: "0.75"
        run: python headless.py

      - name: Upload trade log
        if: always() && hashFiles('trades.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trades-${{ github.run_id }}
          path: trades.csv
          retention-days: 90
